name: Java CI
on:
  push:
    branches:
      - feature/learning
  pull_request:
    branches:
      - feature/learning

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run test and build
        run: chmod +x mvnw && ./mvnw -B clean verify
#        run: docker compose build