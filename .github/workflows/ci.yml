name: Java CI
on:
  push:
    branches:
      - feature/learning
  pull_request:
    branches:
      - feature/learning

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

#      - name: Run tests with full debug
#        run: mvn test -e -X
      - name: Run test and build
        run: mvn clean test
#        run: chmod +x mvnw && ./mvnw -B clean verify -Dsurefire.useFile=false
#        run: docker compose build

    # Job 2: Chạy kiểm thử API tự động bằng Postman (Newman)
  api-test:
    needs: build # Chạy sau khi Job build thành công
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (Required for Newman)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman (Postman CLI runner)
        run: npm install -g newman

      - name: Run Postman Collection against Environment
        run: |
          newman run postman/Facerecognitionattendance.postman_collection.json \
                   -e postman/AttendanceRender.postman_environment.json \
                   --env-var "baseUrl=https://face-recognition-attendance-be.onrender.com"