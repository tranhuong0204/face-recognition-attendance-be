name: Backend CI & API Testing

on:
  push:
    branches: [ "main", "master", "learning" ]
  pull_request:
    branches: [ "main", "master", "learning" ]

jobs:
  # Job 1: Build và test mã nguồn Spring Boot
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run test and build
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

  # Job 2: Chạy kiểm thử API tự động bằng Postman (Newman)
  api-test:
    needs: build # Chạy sau khi Job build thành công
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (Required for Newman)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman (Postman CLI runner)
        run: npm install -g newman

      - name: Run Postman Collection against Environment
        run: |
          newman run postman/collection.json \
                   -e postman/environment.json \
                   --env-var "baseUrl=https://ten-ung-dung-cua-ban.onrender.com"
          