#App
server.port=${PORT:8081}
spring.application.name=HIT-LearningConnect Project
env.url=${ENV_URL:http://localhost:8081}

#spring.redis.host=localhost
#spring.redis.port=6379

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG


#DATABASE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/hit_learning_connect?createDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

#JPA / HIBERNATE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update 

#JWT
#jwt.secret=${JWT_SECRET}

jwt.secret=asdkjashdkjasdhkjasdhkjasdhkjasdh123456

#Expiration time (minutes)
#jwt.access.expiration_time=60
jwt.access.expiration_ms=3600000
jwt.refresh.expiration_ms=86400000  

#Cloudinary
cloudinary.cloud_name=${CLOUD_DINARY_NAME}
cloudinary.api_key=${CLOUD_DINARY_API_KEY}
cloudinary.api_secret=${CLOUD_DINARY_API_SECRET}
